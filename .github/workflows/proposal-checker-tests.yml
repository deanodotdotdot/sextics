name: Repository checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      lean: ${{ steps.scope.outputs.lean }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Identify proof infrastructure changes
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(formal/lean/|scripts/proposals/|scripts/check-library.py|.github/(solve-policy.json|workflows/))'; then
            echo 'lean=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Content, browser, server and release checks
        run: |
          set -euo pipefail
          python3 -m pip install -r scripts/requirements-content.txt
          python3 scripts/proposals/test_check.py
          python3 scripts/test-content.py
          python3 scripts/test-records.py
          python3 scripts/test-discord-alerts.py
          python3 infra/aws/test_package.py
          node --test server/*.test.mjs scripts/test-browser-state.cjs scripts/test-mesh.cjs
          node scripts/test-leaderboard.cjs
          node scripts/test-discussion-links.cjs
          node scripts/test-surface.cjs
          node scripts/test-divisor.cjs
          python3 scripts/validate-records.py
          python3 scripts/check-content.py
          python3 infra/aws/package.py --site . --output "$RUNNER_TEMP/release" --static-only
  lean:
    needs: test
    if: needs.test.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare pinned Lean
        run: |
          set -euo pipefail
          python3 -m pip install -r scripts/requirements-content.txt
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare trusted fixture dependencies
        working-directory: formal/lean
        run: |
          lake exe cache get
          lake build HodgeComputer.Verify
      - name: Real proof, rejection, and sandbox tests
        run: python3 scripts/proposals/test_lean.py
      - name: Shared modules and protected applications
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-library.py --base "$BASE"
