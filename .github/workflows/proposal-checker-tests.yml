name: Proposal checker tests

on:
  pull_request:
    paths:
      - 'scripts/proposals/**'
      - '.github/solve-policy.json'
      - '.github/workflows/*'
      - 'formal/lean/**'
      - 'scripts/*discord*.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Structure and attribution tests
        run: |
          python3 -m pip install -r scripts/requirements-content.txt
          python3 scripts/proposals/test_check.py
          python3 scripts/test-content.py
          python3 scripts/test-discord-alerts.py
          node scripts/test-leaderboard.cjs
          node scripts/test-divisor.cjs
      - name: Prepare pinned Lean
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare trusted fixture dependencies
        working-directory: formal/lean
        run: |
          lake exe cache get
          lake build HodgeComputer.Verify
      - name: Real proof, rejection, and sandbox tests
        run: python3 scripts/proposals/test_lean.py
