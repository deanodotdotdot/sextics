name: Refresh comment leaderboard

on:
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  id-token: write

concurrency:
  group: comment-leaderboard
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'hodge-computer/sextics' && vars.AWS_WEBSITE_ROLE != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Build current comment leaderboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-comment-leaderboard.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_WEBSITE_ROLE }}
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '977936242184'
      - name: Publish comment leaderboard
        run: >-
          aws s3 cp leaderboard/comment-counts.json
          s3://hodge-sextics-site-977936242184-us-east-1/leaderboard/comment-counts.json
          --cache-control 'public,max-age=60' --content-type application/json
          --sse AES256 --only-show-errors
